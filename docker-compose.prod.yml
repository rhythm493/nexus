services:
  nexus:
    image: ghcr.io/rhythm493/pocket-assistant/nexus:latest
    container_name: nexus
    ports:
      - "8443:8443"
      - "8080:8080"
    environment:
      - LOG_LEVEL=info
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8443
      - RADIO_ENABLED=true
      - YOUTUBE_ENABLED=true
      - RADIO_LIQUIDSOAP_PATH=liquidsoap
      - RADIO_STREAM_PORT=8080
      - LIBRARY_DATA_DIR=/app/data/library
      - LIBRARY_DATABASE_PATH=/app/data/library.db
    volumes:
      - library-data:/app/data/library
      - library-db:/app/data
      - certs-data:/app/certs
      - streams-data:/app/streams
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  library-data:
  library-db:
  certs-data:
  streams-data:
