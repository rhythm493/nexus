version: '3.8'

services:
  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # For HTTP/3 support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nexus

  # Nexus server (HTTP only, Caddy handles HTTPS)
  nexus:
    image: ghcr.io/rhythm493/nexus:main
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8080:8443"  # Internal HTTP port mapped from container's default 8443
    environment:
      - SERVER_PORT=8443  # Keep internal port, but it's now HTTP not HTTPS
    env_file:
      - .env
    volumes:
      - nexus_certs-data:/app/certs
      - nexus_library-data:/app/library
      - nexus_mcp-data:/app/mcp-servers

volumes:
  caddy_data:
  caddy_config:
  nexus_certs-data:
  nexus_library-data:
  nexus_mcp-data:
