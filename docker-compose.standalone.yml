version: '3.8'

# Standalone version - Nexus only (no QuickCom)
# Use this if you don't need grocery shopping features

services:
  # Nexus Go server
  nexus:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexus
    ports:
      - "8443:8443"  # HTTPS API
      - "8080:8080"  # HTTP radio stream
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8443
      - RADIO_ENABLED=true
      - YOUTUBE_ENABLED=true
      - RADIO_LIQUIDSOAP_PATH=liquidsoap
      - RADIO_STREAM_PORT=8080
      - LIBRARY_DATA_DIR=/app/data/library
      - LIBRARY_DATABASE_PATH=/app/data/library.db
    volumes:
      - library-data:/app/data/library
      - library-db:/app/data
      - bin-data:/app/data/bin
      - certs-data:/app/certs
      - streams-data:/app/streams
      - ./server/config/config.yaml:/app/config/config.yaml:ro
      - ./mcp-repos:/app/mcp-repos:ro
    networks:
      - nexus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # mDNS reflector for service discovery
  mdns-reflector:
    image: flungo/avahi
    container_name: mdns-reflector
    network_mode: host
    environment:
      - REFLECTOR_ENABLE_REFLECTOR=yes
    restart: unless-stopped

networks:
  nexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  library-data:
    driver: local
  library-db:
    driver: local
  bin-data:
    driver: local
  certs-data:
    driver: local
  streams-data:
    driver: local
