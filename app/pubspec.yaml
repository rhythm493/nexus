name: nexus
description: Voice-controlled AI assistant with online backend.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client with SSE support
  dio: ^5.4.0

  # Voice input (offline with sherpa-onnx)
  sherpa_onnx: ^1.12.23
  path_provider: ^2.1.2
  path: ^1.9.0

  # Audio recording for voice input
  record: ^5.2.0

  # For model download
  http: ^1.2.0
  archive: ^3.6.1

  # State management
  provider: ^6.1.1

  # Persistent settings storage
  shared_preferences: ^2.2.2

  # File picker for cert import
  file_picker: ^8.0.0

  # Model metadata cache with ETag-based revalidation
  flutter_cache_manager: ^3.4.1

  # Permissions
  permission_handler: ^12.0.0

  # Location services
  geolocator: ^13.0.2

  # UUID generation
  uuid: ^4.3.3

  # Material icons
  cupertino_icons: ^1.0.6
  mobile_scanner: ^7.1.4

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Markdown rendering for assistant responses
  flutter_markdown: ^0.7.6

  # Charts for data visualization
  fl_chart: ^0.70.2

  # Code syntax highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # URL launching for link component
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  record_linux: ^1.2.0

flutter:
  uses-material-design: true
