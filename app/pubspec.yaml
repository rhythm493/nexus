name: nexus
description: Voice-controlled AI assistant connecting to your PC over LAN.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client with SSE support
  dio: ^5.4.0

  # mDNS service discovery
  bonsoir: ^5.1.4

  # Voice input (offline with sherpa-onnx)
  sherpa_onnx: ^1.12.23
  path_provider: ^2.1.2
  path: ^1.9.0

  # Audio recording for voice input
  record: ^5.2.0

  # For model download
  http: ^1.2.0
  archive: ^3.6.1

  # Secure storage for certificates
  flutter_secure_storage: ^10.0.0

  # State management
  provider: ^6.1.1

  # Persistent settings storage
  shared_preferences: ^2.2.2

  # File picker for cert import
  file_picker: ^8.0.0

  # Permissions
  permission_handler: ^12.0.0

  # Location services
  geolocator: ^13.0.2

  # UUID generation
  uuid: ^4.3.3

  # Material icons
  cupertino_icons: ^1.0.6
  mobile_scanner: ^7.1.4

  # Shimmer loading effect
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  record_linux: ^1.2.0

flutter:
  uses-material-design: true
