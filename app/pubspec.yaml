name: nexus
description: Voice-controlled AI assistant with online backend.
publish_to: 'none'

version: 0.3.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Offline voice input (sherpa-onnx) and its storage/caching needs
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.6
  path: ^1.9.1

  # Audio recording for voice input
  record: ^7.1.1

  # For model download (SSE + plain HTTP)
  http: ^1.6.0
  archive: ^4.3.0

  # State management
  provider: ^6.1.5+1

  # Persistent settings storage
  shared_preferences: ^2.5.5

  # Model metadata cache with ETag-based revalidation
  flutter_cache_manager: ^3.4.5

  # Location services
  geolocator: ^14.1.1

  # UUID generation
  uuid: ^4.6.0

  # Shimmer loading effect
  shimmer: ^4.0.0

  # URL launching for link component
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true